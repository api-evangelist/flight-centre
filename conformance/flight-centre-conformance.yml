generated: '2026-07-28'
method: searched
source: provider published pages + live probes; see evidence per entry
note: |
  Flight Centre Travel Group publishes no machine interface of its own, so most
  cross-cutting API standards are not applicable rather than failed. The two
  standards that genuinely bind here are IATA NDC (as a certified consumer of the
  standard) and, one level down at 70%-owned TPConnects, IATA NDC Schema 18.2/21.3
  plus OAuth 2.0 / OpenID Connect on the tpconnects.com web property.

  Nothing in this file asserts a compliance programme. No SOC 2, ISO 27001, PCI DSS,
  HIPAA or FedRAMP attestation is published on any Flight Centre Travel Group brand
  domain, so no `Compliance` pointer is emitted in apis.yml.
standards:
- id: iata-ndc
  name: IATA New Distribution Capability
  conforms: true
  role: consumer
  level: Level 4 - Full Offer and Order Management
  evidence: >-
    FCM's own published claim to be the first global travel management company to
    achieve IATA NDC Level 4 certification, covering full offer and order management
    including servicing changes and disruption handling.
  source: https://www.fcmtravel.com/en/resources/news-hub/fcm-is-first-global-tmc-to-achieve-iata-ndc-level-4-certification
  caveat: >-
    Recorded as the organisation's own published claim corroborated by trade press,
    not as a registry-verified fact - the IATA NDC certification registry page
    probed at iata.org returned 404. No public NDC endpoint and no published NDC API
    exists under any Flight Centre brand.
- id: iata-ndc-schema-18.2
  name: IATA NDC Schema 18.2
  conforms: true
  entity: TPConnects Technologies (70% FCTG-owned)
  evidence: TPConnects Iris API product page names "IATA NDC Schema 18.2 and 21.3"
    as the implemented message schema across 60+ NDC/LCC carriers and 4 GDSs.
  source: https://tpconnects.com/iris-travel-seller-solutions/iris-api/
- id: iata-ndc-schema-21.3
  name: IATA NDC Schema 21.3
  conforms: true
  entity: TPConnects Technologies (70% FCTG-owned)
  evidence: Same Iris API product page; Astra NDC gateway is separately described as
    normalizing NDC versions 18.2 through 24.4.
  source: https://tpconnects.com/iris-travel-seller-solutions/iris-api/
- id: iata-one-order
  name: IATA ONE Order
  conforms: unknown
  evidence: Referenced repeatedly in TPConnects conference-panel material, but no
