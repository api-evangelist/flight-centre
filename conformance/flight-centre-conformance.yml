  source: https://tpconnects.com/llms.txt
- id: mcp
  name: Model Context Protocol
  conforms: announced
  entity: TPConnects Technologies (70% FCTG-owned)
  evidence: >-
    Two 2026 press releases announce an MCP layer over the Astra NDC gateway (March
    12, 2026) and over the Iris aggregator (April 7, 2026), described as exposing
    60+ airlines through a single machine-readable protocol.
  source: https://tpconnects.com/news/iris-mcp-layer-ai-airline-distribution/
  caveat: >-
    Announcement only. No MCP server URL is published, mcp.tpconnects.com does not
