actions:
  apisYmlCreated: true
  apisListed: 0
  openapiDirectoryCreated: false
  reason: |
    No parseable OpenAPI, Swagger, RAML, AsyncAPI, Postman collection or XML schema
    was found on any Flight Centre Travel Group domain, so no openapi/ directory was
    created. apis[] is deliberately empty - the correct and honest representation of
    a large travel agency group that consumes machine interfaces at industrial scale
    and publishes none.
  followUp: |
    TPConnects Technologies (70% FCTG-owned, Dubai) merits its own provider profile -
    slug tpconnects - with the Iris and Astra API families, the ndcmarketplace.com
    B2B portal, and a note that its reference documentation is gated behind ReadMe /
    Auth0. WhereTo (all/whereto already exists) should be cross-referenced as an
    FCTG-owned brand.
