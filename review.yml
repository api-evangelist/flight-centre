switchingCost:
  interfaceShape:
    value: none-published
    standardNamed: null
    evidence: |
      Flight Centre Travel Group publishes no interface of any kind - no REST
      reference, no OpenAPI, no SOAP/XML schema, no GraphQL, no partner API. There
      is nothing to conform to a standard and nothing to swap. The customer contract
      is a commercial travel management agreement and a set of human and web
      touchpoints, not a machine interface.

      The nearest thing to a standard interface anywhere in the group is one level
      down, at majority-owned TPConnects, whose Iris API product page names 'IATA
      NDC Schema 18.2 and 21.3' - a genuine open standard that other aggregators
      (Duffel, Travelfusion, Verteil, the GDS NDC gateways) also implement. But that
      interface belongs to TPConnects, is not offered under a Flight Centre brand,
      and its reference documentation is behind a ReadMe/Auth0 login.
    caveat: |
      Corporate Traveler's llm-info page claims 'Integration with expense management
      systems via APIs/data connectors' for the Melon platform. No API is named,
      versioned, documented, or given an endpoint. That is a marketing statement, not
      a published interface, and it is not counted here.
  secondSource:
    value: alternatives-with-migration
    alternativesConsidered:
      - American Express Global Business Travel (GBT), including Egencia
      - BCD Travel
      - CWT
      - Corporate Travel Management (CTM) - the other large ASX-listed Australian
        agency group
      - Navan
      - TravelPerk
      - Webjet Group / Webjet TravelLink (Australian OTA and B2B bedbank)
      - Direct-to-supplier and OBT-only stacks (Concur Travel, Deem, Cytric) with a
        different TMC fulfilling
    evidence: |
      Nothing Flight Centre sells is unique inventory. It resells airline, hotel,
      cruise and land content that every other agency group can also source through
      Sabre, Amadeus, Travelport and the NDC aggregators. A corporate customer can
      genuinely obtain the same capability from GBT, BCD, CWT, CTM, Navan or
      TravelPerk.

      Moving is a project, not a swap. What has to be rebuilt: traveller profiles and
      loyalty numbers re-keyed into a new OBT, corporate policy and approval
      hierarchies re-authored, negotiated airline and hotel rate agreements re-loaded
      under a new IATA/ARC agency number, expense and HR feeds re-pointed, duty of
      care and traveller-tracking integrations re-established, and historical booking
      and spend data extracted for reporting continuity. Because Flight Centre
      publishes no bulk export operation, that last step is the one with no
      documented path.

      On the leisure side the second-source position is stronger still - a consumer
      has no switching cost at all beyond an unused credit or a World360 Rewards
      balance.
  exitPath:
    value: export-on-request
    operationCited: |
      FCM privacy policy, verbatim: 'where any personal information has been
      processed on the basis of your voluntary consent or as necessary to perform a
      contract to which you are a party, request a copy of such personal information
      in a suitable machine-readable format or have that personal information
      transmitted by us to another controller'.
    mechanism: OneTrust web form linked from https://www.fctgl.com/privacy-policy,
      confirmed live 200 at https://privacyportal-de.onetrust.com/webform/01c95262-28d1-4b76-89f7-6b0b650d1af2/d036c47c-47be-4cb7-be63-5a65a9cc5f0d,
      plus regional privacy mailboxes privacy@flightcentre.com.au,
      privacy@flightcentre.co.nz, privacy@am.flightcentre.com, privacy@fctg.co.za.
    evidence: |
      This is a GDPR Article 20 style right implemented as a manual subject access
      request for personal information about an individual. It is real, documented,
      and the request form is live - which is more than most travel intermediaries
      publish - but it is not a data-portability product.

      There is no bulk export, dump, or reporting-extract operation published for
      corporate customers. The FCM Platform marketing page advertises '600+ reports'
      and Corporate Traveler advertises that Melon lets a customer 'export all
      expense reports to their in-house expense management system', but neither
      names an API, a format, a schema, or a documented extract operation. A
      departing corporate customer's booking history, negotiated rate performance and
      traveller profile data therefore have no published machine route out - the exit
      is whatever the individually negotiated contract says, and the contract is not
      published.
  identifierPortability:
    summary: No identifier schema published; industry-standard IATA airline and
      airport codes plus PNR record locators inherited from the GDS/NDC layer, with
      undocumented internal record IDs in Melon and the FCM Platform.
    portableIdentifiers:
      - IATA two-letter airline codes and three-letter airport codes - fully portable,
        universal in the industry
      - PNR record locators - portable in the sense that any agency or airline can
        retrieve a PNR by locator, though the PNR itself lives in the GDS or airline
        host and is claimed by the ticketing agency
      - IATA / ARC agency accreditation numbers - these are the identifier that
        actually binds. Negotiated fares, commissions and full-content entitlements
        attach to the accredited agency number, so they do not travel with the
        corporate customer when it changes TMC; they have to be renegotiated.
      - IATA NDC order IDs and OrderItem IDs (via TPConnects Iris, which names NDC
        18.2/21.3)
    nonPortableIdentifiers:
      - GDS-specific record identifiers in Sabre and Amadeus
      - Melon and FCM Platform internal traveller, booking and approval record IDs -
        no schema, no documentation, no published mapping
      - World360 Rewards loyalty member IDs - proprietary to Flight Centre and
        worthless outside it
    evidence: |
      Flight Centre publishes no data model, no field reference and no identifier
      documentation, so none of this can be read off a schema. What can be verified
      is the structural fact: the identifiers with real commercial weight in an
      agency relationship are the IATA/ARC agency number and the GDS host record,
      neither of which belongs to the customer.
  contractualLockIn:
    value: nothing published
    verbatimPublished:
      - source: https://www.fcmtravel.com/en/privacy-policy
        quote: 'we will cease to retain your personal data, or remove the means by
          which the data can be associated with you, as soon as it is reasonable to
          assume that such retention no longer serves the purposes for which the
          personal data were collected'
      - source: https://www.fcmtravel.com/en/privacy-policy
        quote: 'access, update, modify, rectify, erase, object to, or obtain a copy
          of the personal information that we hold on you'
    notPublished: |
      No developer terms of service, no API licence, no partner agreement, no
      supplier integration terms and no corporate travel management master services
      agreement is published anywhere on fctgl.com, fcmtravel.com,
      corporatetraveller.com.au or flightcentre.com.au. /terms, /terms-of-use,
      /terms-and-conditions and /legal all return 404 on the domains probed.
      Corporate TMC engagements at this scale are individually negotiated and
      confidential.
    honestFinding: |
      Nothing about minimum term, exclusivity, full-content commitment, transaction
      or segment fees, termination notice, or data return on termination can be
      cited, because none of it is published. Recording an inference here would be
      fabrication. The finding is the absence: for the largest travel agency group in
      Australia, the entire commercial contract - the thing that actually creates the
      switching cost - is invisible to public research.
  distributionModel:
    value: aggregator-reseller
    evidence: |
      Flight Centre Travel Group is a demand-side intermediary, not a supplier. It
      holds no inventory of its own. Leisure customers reach it through roughly 300+
      Australian retail stores (310 store URLs in the flightcentre.com.au sitemap),
      brand websites, and the Aunt Betty / BYOjet / StudentUniverse online channels;
      corporate customers reach it through negotiated TMC contracts fulfilled through
      the FCM Platform and Corporate Traveller's Melon.

      Upstream it is GDS-intermediated: Sabre was named a global technology partner
      to Flight Centre Travel Group in March 2018 for Australia and New Zealand, and
      FCM has publicly worked NDC content into both Amadeus Selling Platform Connect
      and Sabre. Hotel content is piped in through a HotelHub API partnership rather
      than a Flight Centre-built connection. NDC content is sourced through
      'preferred technology aggregators in each of the markets where FCM operates',
      one of which is its own majority-owned TPConnects.
  ndcPosture:
    certificationClaimed: IATA NDC Level 4 - Full Offer and Order Management
    certificationClaim: |
      'we were one of the first global travel management companies to achieve IATA
      (International Air Transport Association) NDC certification' - fcmtravel.com
      NDC hub. FCM states it is the first global travel management company to achieve
      Level 4, confirming it 'can provide Full Offer and Order Management, meaning in
      addition to booking NDC airline content, the company's travel consultants can
      also support changes in travellers NDC bookings and flight disruption'.
    publicNdcEndpoint: false
    ndcApiPublished: false
    gdsSurcharges: not applicable - Flight Centre is the agency, not the airline; it
      pays or absorbs carrier GDS surcharges rather than levying them.
    summary: |
      IATA NDC Level 4 certified as a travel management company (first global TMC to
      reach that level), but no public NDC endpoint and no published NDC API. NDC
      content is consumed through Amadeus, Sabre and through majority-owned
      TPConnects, whose Iris API implements IATA NDC Schema 18.2 and 21.3 behind a
      gated ReadMe reference. In November 2025 FCM announced an Oversee partnership
      for NDC reshopping, again a consumed capability rather than a published one.
    caveat: |
      IATA's NDC certification registry page probed at
      https://www.iata.org/en/programs/airline-distribution/retailing/ndc-certification-registry/
      returned 404, so the Level 4 claim is recorded as the organisation's own
      published claim, corroborated by trade press, not as a registry-verified fact.
  accessGate:
    value: none-published
    whatADeveloperMustSign: |
      Nothing, because there is nothing to sign up for. No developer programme, no
      API key issuance, no sandbox, no application form, no partner portal exists on
      any Flight Centre Travel Group brand domain.

      To transact with the group commercially a party must instead: as a corporate
      customer, negotiate and sign a confidential travel management agreement; as a
      supplier, contract through the group's supplier relations function (no public
      supplier page - fctgl.com/suppliers returns 404); as an independent agent, join
      Envoyage; as a travel seller wanting the group's aggregated air content, go to
      TPConnects and request a demo (marketing@tpconnects.com), which is a commercial
      agreement with a company that is 70% Flight Centre-owned, not a Flight Centre
      product.

      Underlying all air fulfilment is IATA / ARC accreditation, which the group holds
      and a customer does not - that accreditation is the licence that makes the
      intermediary necessary in the first place.
    gated: true
