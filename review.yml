aid: flight-centre
name: Flight Centre Travel Group
review:
  question: Does Flight Centre Travel Group publish a public developer portal, API
    reference, or machine-readable API contract?
  answer: false
  date: '2026-07-28'
  reviewer: API Evangelist
  tier: ota-metasearch
  homeMarket: Australia
  primaryDomain: fctgl.com
findings:
  summary: |
    Flight Centre Travel Group publishes no developer portal, no API reference, no
    OpenAPI or Swagger document, and no partner API documentation on any domain it
    controls. Every developer-shaped subdomain probed on fctgl.com, fcmtravel.com,
    flightcentre.com.au, corporatetraveler.us, discova.com, studentuniverse.com and
    envoyage.com fails to resolve in DNS. Every conventional discovery path on
    fctgl.com (/developers, /api, /docs, /openapi.json, /swagger.json, /api-docs,
    /.well-known/security.txt) returns 404. No GitHub organisation exists for
    flightcentre, fctg, fcmtravel or FlightCentreTravelGroup; the one organisation
    that does exist (github.com/Discova, the group's wholesale DMC brand) has zero
    public repositories.

    The group is a demand-side intermediary, not a supplier. It buys airline, hotel,
    cruise and land content through the GDSs and through NDC aggregators, then
    resells it through retail stores, brand websites and corporate travel programmes.
    Its API surface is therefore almost entirely inbound consumption, not outbound
    publication.

    The one genuine machine-readable distribution asset in the group is TPConnects
    Technologies, the Dubai NDC aggregator in which Flight Centre raised its equity
    stake from 22.5% to 70% in March 2022 and which is listed as a group brand on
    fctgl.com/brands. TPConnects publishes public product pages for an Iris API
    (travel-seller side) and an Astra API (airline side), but its reference
    documentation at docs.tpconnects.com redirects to a ReadMe dashboard login and
    tpconnects.readme.io returns 401 /inactive. TPConnects is a distinct legal entity
    with its own brand and warrants its own provider profile; it is recorded here as
    evidence rather than listed under Flight Centre's apis[].
  developerPortal:
    published: false
    url: null
    note: No developer portal exists on any Flight Centre Travel Group brand domain.
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
