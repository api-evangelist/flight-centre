      fetched: '2026-10-20'
      quote: >-
        We use key service providers located in India, Indonesia, Philippines, Hong Kong, USA, United Kingdom, and
        Australia.
    - source: https://www.fctgl.com/privacy-policy
      http_status: 200
      fetched: '2026-10-20'
      quote: >-
        We will ensure that any such international transfers are necessary for the performance of a contract between
        you and the overseas recipient, and/or are made subject to appropriate or suitable safeguards as required by
