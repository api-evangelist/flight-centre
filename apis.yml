apis:
- name: TPConnects Iris API
  description: Iris is the NDC aggregator API of TPConnects, the Dubai NDC aggregator majority-owned by Flight Centre Travel Group. It gives travel
    sellers (OTAs, TMCs, consolidators and corporate booking tools) normalized airline content from 60+ NDC/LCC carriers and 4 GDS systems, built
    on IATA NDC Schema 18.2 and 21.3, with order creation, change, ancillaries, disruption handling and notifications. Its reference documentation
    (docs.tpconnects.com/iris) redirects to a ReadMe login, and no public base URL or machine-readable contract is published.
  humanURL: https://tpconnects.com/iris-travel-seller-solutions/iris-api/
  tags:
  - NDC
  - Air
  - Aggregator
  properties:
  - type: Documentation
    url: https://docs.tpconnects.com/iris
  aid: flight-centre:tpconnects-iris-api
- name: TPConnects Astra NDC API Gateway
  description: Astra is the TPConnects NDC API Gateway for airlines, letting carriers make their content and offers available to travel sellers
    directly, with booking, seat and baggage ancillaries and rich media content. Reference documentation sits behind the same TPConnects ReadMe
    login; no public base URL or machine-readable contract is published.
  humanURL: https://tpconnects.com/astra-airline-solutions/astra-api/
  tags:
  - NDC
  - Airline
  - Distribution
  properties: []
  aid: flight-centre:tpconnects-astra-ndc-api-gateway

