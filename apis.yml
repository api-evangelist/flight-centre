description: Flight Centre Travel Group (ASX FLT) is a Brisbane-headquartered travel retailer and corporate travel manager, one of the largest
  agency groups in the world and by far the largest in its home market of Australia. It operates more than thirty brands across leisure retail
  (Flight Centre, Travel Associates, Cruiseabout, Aunt Betty, BYOjet, Envoyage, Scott Dunn, StudentUniverse), corporate travel management (FCM,
  Corporate Traveller, Stage and Screen, FCM Consulting) and wholesale supply (Discova, Infinity Holidays, Topdeck, Backroads Touring, TPConnects),
  with company-owned operations in twenty-four countries and licensed operations in roughly ninety more. Structurally it sits on the demand side
  of the travel distribution chain - it is an aggregator-reseller that buys airline, hotel, cruise and land content through the GDSs (Sabre and
  Amadeus), through NDC aggregators, and through direct supplier agreements, and resells it to consumers and corporate travel programmes. Its
  API posture is honestly assessed as none published - Flight Centre Travel Group operates no developer portal, publishes no API reference, no
  OpenAPI, and no partner API documentation on any of its brand domains, and probing developer, developers, docs and api subdomains of fctgl.com,
  fcmtravel.com and flightcentre.com.au returns no DNS record at all. The group's genuine machine-readable distribution asset is TPConnects, the
  Dubai NDC aggregator it holds a majority stake in, whose Iris and Astra APIs are described on public product pages but whose reference documentation
  sits behind a ReadMe login. Flight Centre and FCM were the first global travel management company to receive IATA NDC Level 4 certification
  for full offer and order management, yet no public NDC endpoint is exposed. There is no self-serve access gate and no bulk export - the only
  documented exit path is a personal-data subject access request through a OneTrust web form.

